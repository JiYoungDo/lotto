<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0052ff" />
    <title>인터넷 연결 확인 · 로또 연구소</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #0a0b0d; background: #fff; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #5b616e; line-height: 1.6; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; color: #fff; background: #0052ff; border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>로또 연구소는 최신 당첨 번호와 회원 정보를 서버에서 가져와요.<br />Wi-Fi나 데이터 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
