spring.application.name=lotto

spring.datasource.url=jdbc:h2:file:./data/lotto
spring.jpa.hibernate.ddl-auto=update

# 관리자 계정: 실제 값은 config/application.properties 에 적습니다 (git 제외).
# 비밀번호가 비어 있으면 실행할 때마다 임시 비밀번호를 만들어 로그에 출력합니다.
lotto.admin.username=${LOTTO_ADMIN_USERNAME:admin}
lotto.admin.password=${LOTTO_ADMIN_PASSWORD:}

# DB 웹 화면 (H2 콘솔): http://localhost:5173/h2-console  — 관리자로 로그인해야 열립니다
# 접속: JDBC URL jdbc:h2:file:./data/lotto / User Name·Password 모두 비워 두기
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
