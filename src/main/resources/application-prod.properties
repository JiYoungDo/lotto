# 운영(서버) 전용 설정. 서버를 켤 때 SPRING_PROFILES_ACTIVE=prod 이면 application.properties 위에 덮어씁니다.

# DB 웹 화면(H2 콘솔)은 운영에서 끕니다.
spring.h2.console.enabled=false

# Caddy(HTTPS를 담당하는 앞단 서버) 뒤에서 돌기 때문에, 원래 접속이 https였다는 정보를 믿고 씁니다.
server.forward-headers-strategy=framework

# 로그인 쿠키 보호: https에서만 전송, 자바스크립트에서 읽기 금지, 다른 사이트에서 오는 요청에는 안 보냄
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 서버를 끌 때 처리 중이던 요청을 마무리하고 끕니다. (DB 파일 손상 위험을 줄임)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.compression.enabled=true
